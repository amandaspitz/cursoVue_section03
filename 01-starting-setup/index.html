<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue Basics</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Vue Course Goals</h1>
    </header>
    <section id="user-goals">
      <h2>My course goals</h2>
      <input type="text" v-model="newGoal" />
      <button @click="addGoal">Add Goal</button>
      <p v-show="goals.length === 0">
        No goals have been added yet - please start adding some!
      </p>
      <ul v-show="goals.length > 0">
        <!-- v-else always have to follow straight (neighbour) after a v-if element, also can use v-if / v-if else e v-else-->
        <li v-for="(goal, index) in goals" :key="goal" @click="removeGoal(index)">
          <p>{{ goal }} - {{index}}
            <input type="text" @click.stop></p>
          </li>
          
        <!--  <li v-for="goal in goals">{{ goal }}</li>-->
        <!-- xxx in is also {{ xxx }} and only access this element inside this element, cant use {{ xxx }} outside of the element -->
      </ul>
      <!-- <ul>
        <li v-for="(value, key, index) in {name:'Max', age:31}">
          {{ key }}: {{ value }} {{ index }}
        </li>
      </ul> -->
    </section>
  </body>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="app.js" defer></script>
</html>
